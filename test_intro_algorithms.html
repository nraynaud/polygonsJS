<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Testing Algorithms</title>
    <link rel="stylesheet" href="https://code.jquery.com/qunit/qunit-2.21.0.css">
    <style>
        .svgTest td {
            border: solid 1px green;
        }

        .svgTest th {
            text-align: center !important; /*some qunit selector use an #id, so we have to force it*/
        }

        path {
            fill: none;
            stroke: green;
            vector-effect: non-scaling-stroke;
            stroke-width: 0.3px;
        }
    </style>
</head>
<body>
<h1>some "Introduction to Algorithms" exercises.</h1>
<div id="qunit"></div>
<div id="qunit-fixture"></div>
<script src="jquery-1.10.2.js"></script>
<script src="https://code.jquery.com/qunit/qunit-2.21.0.js"></script>
<script>


    function check(cond, message) {
        if (!cond) {
            throw new Error(message);
        }
    }

    class Matrix {
        limits;

        constructor(data, offset = [0, 0], [n, m] = [data.length, data[0].length]) {
            this.data = data;
            this.offset = offset
            this.limits = [n, m];
        }

        get(i, j) {
            return this.data[i + this.offset[0]][j + this.offset[1]];
        }

        set(i, j, value) {
            this.data[i + this.offset[0]][j + this.offset[1]] = value;
        }

        getRow(i) {
            return this.data[i + this.offset[0]];
        }

        getColumn(j) {
            return this.data.map(row => row[j + this.offset[1]]);
        }

        set content(otherMatrix) {
            for (let i = 0; i < this.n; i++) {
                for (let j = 0; j < this.m; j++) {
                    this.set(i, j, otherMatrix.get(i, j));
                }
            }
        }

        get n() {
            return Math.min(this.data.length - this.offset[0], this.limits[0]);
        }

        get m() {
            return Math.min(this.data[0].length - this.offset[1], this.limits[1]);
        }

        subMatrix([dx, dy] = [0, 0], [n, m] = [this.n, this.m]) {
            let offset = [this.offset[0] + dx, this.offset[1] + dy];
            let nm = [n, m];
            check(n > 0, `n should be > 0, got ${n}`);
            check(m > 0, `m should be > 0, got ${m}`);
            console.log('subMatrix', offset, nm)
            return new Matrix(this.data, offset, nm);
        }

        add(B) {
            check(this.n === B.n, `add: this.n !== B.n (${this.n} !== ${B.n})`);
            check(this.m === B.m, `add: this.m !== B.m (${this.m} !== ${B.m})`);
            let C = Matrix.zeros(this.n, this.m);
            for (let i = 0; i < this.n; i++) {
                for (let j = 0; j < this.m; j++) {
                    C.set(i, j, this.get(i, j) + B.get(i, j));
                }
            }
            return C;
        }

        scale(scalar) {
            let C = Matrix.zeros(this.n, this.m);
            for (let i = 0; i < this.n; i++) {
                for (let j = 0; j < this.m; j++) {
                    C.set(i, j, this.get(i, j) * scalar);
                }
            }
            return C;
        }

        sub(B) {
            const mB = B.scale(-1)
            return this.add(mB);
        }

        frNorm() {
            let sum = 0;
            for (let i = 0; i < this.n; i++) {
                for (let j = 0; j < this.m; j++) {
                    sum += this.get(i, j) ** 2;
                }
            }
            return Math.sqrt(sum);
        }

        static fromArray(array) {
            return new Matrix(array.map(row => row.slice()));
        }

        static identity(n) {
            let data = [];
            for (let i = 0; i < n; i++) {
                data[i] = [];
                for (let j = 0; j < n; j++) {
                    data[i][j] = i === j ? 1 : 0;
                }
            }
            return new Matrix(data);
        }

        static zeros(n, m) {
            let data = [];
            for (let i = 0; i < n; i++) {
                data[i] = [];
                for (let j = 0; j < m; j++) {
                    data[i][j] = 0;
                }
            }
            return new Matrix(data);
        }


        static random(n, m) {
            let data = [];
            for (let i = 0; i < n; i++) {
                data[i] = [];
                for (let j = 0; j < m; j++) {
                    data[i][j] = Math.random();
                }
            }
            return new Matrix(data);
        }
    }

    function matrixMult(A, B) {
        check(A.m === B.n, `matrixMult: A.m !== B.n (${A.m} !== ${B.n})`);
        let C = Matrix.zeros(A.n, B.m);
        for (let i = 0; i < A.n; i++) {
            for (let j = 0; j < B.m; j++) {
                let sum = 0;
                for (let k = 0; k < A.m; k++) {
                    sum += A.get(i, k) * B.get(k, j);
                }
                C.set(i, j, sum);
            }
        }
        return C;
    }

    function matrixMultRecusive(A, B, C) {
        check(A.m === B.n, `matrixMultRecusive: A.m !== B.n (${A.m} !== ${B.n})`);
        check(C.n === A.n, `matrixMultRecusive: C should be compatible with A (${C.n} !== ${A.n})`);
        check(C.m === B.m, `matrixMultRecusive: C should be compatible with B (${C.m} !== ${B.m})`);

        if (C.n === 1 && C.m === 1) {
            C.set(0, 0, C.get(0, 0) + A.get(0, 0) * B.get(0, 0));
        } else {
            const n_2 = Math.max(Math.floor(C.n / 2), 1);
            console.log(`n_2: ${n_2}, n: ${C.n}`);
            const A11 = A.subMatrix([0, 0], [n_2, n_2]);
            const A12 = A.subMatrix([0, n_2], [n_2, n_2]);
            const A21 = A.subMatrix([n_2, 0], [n_2, n_2]);
            const A22 = A.subMatrix([n_2, n_2], [n_2, n_2]);
            const B11 = B.subMatrix([0, 0], [n_2, n_2]);
            const B12 = B.subMatrix([0, n_2], [n_2, n_2]);
            const B21 = B.subMatrix([n_2, 0], [n_2, n_2]);
            const B22 = B.subMatrix([n_2, n_2], [n_2, n_2]);
            const C11 = C.subMatrix([0, 0], [n_2, n_2]);
            const C12 = C.subMatrix([0, n_2], [n_2, n_2]);
            const C21 = C.subMatrix([n_2, 0], [n_2, n_2]);
            const C22 = C.subMatrix([n_2, n_2], [n_2, n_2]);
            matrixMultRecusive(A11, B11, C11);
            matrixMultRecusive(A11, B12, C12);
            matrixMultRecusive(A21, B11, C21);
            matrixMultRecusive(A21, B12, C22);
            matrixMultRecusive(A12, B21, C11);
            matrixMultRecusive(A12, B22, C12);
            matrixMultRecusive(A22, B21, C21);
            matrixMultRecusive(A22, B22, C22);
        }
    }

    function strassen(A, B, C) {
        check(A.m === B.n, `strassen: A.m !== B.n (${A.m} !== ${B.n})`);
        check(A.n === B.m, `strassen: A.n !== B.m (${A.n} !== ${B.m})`);
        check(A.n === A.m, `strassen: A should be square (${A.n} !== ${A.m})`);
        check(B.n === B.m, `strassen: B should be square (${B.n} !== ${B.m})`);
        if (C.n === 1 && C.m === 1) {
            C.set(0, 0, C.get(0, 0) + A.get(0, 0) * B.get(0, 0));
        } else {
            const n_2 = Math.floor(C.n / 2);
            console.log(`n_2: ${n_2}, n: ${C.n}`);
            const A11 = A.subMatrix([0, 0], [n_2, n_2]);
            const A12 = A.subMatrix([0, n_2], [n_2, n_2]);
            const A21 = A.subMatrix([n_2, 0], [n_2, n_2]);
            const A22 = A.subMatrix([n_2, n_2], [n_2, n_2]);
            const B11 = B.subMatrix([0, 0], [n_2, n_2]);
            const B12 = B.subMatrix([0, n_2], [n_2, n_2]);
            const B21 = B.subMatrix([n_2, 0], [n_2, n_2]);
            const B22 = B.subMatrix([n_2, n_2], [n_2, n_2]);
            const S1 = B12.sub(B22);
            const S2 = A11.add(A12);
            const S3 = A21.add(A22);
            const S4 = B21.sub(B11);
            const S5 = A11.add(A22);
            const S6 = B11.add(B22);
            const S7 = A12.sub(A22);
            const S8 = B21.add(B22);
            const S9 = A11.sub(A21);
            const S10 = B11.add(B12);
            const P1 = strassen(A11, S1, Matrix.zeros(n_2, n_2));
            const P2 = strassen(S2, B22, Matrix.zeros(n_2, n_2));
            const P3 = strassen(S3, B11, Matrix.zeros(n_2, n_2));
            const P4 = strassen(A22, S4, Matrix.zeros(n_2, n_2));
            const P5 = strassen(S5, S6, Matrix.zeros(n_2, n_2));
            const P6 = strassen(S7, S8, Matrix.zeros(n_2, n_2));
            const P7 = strassen(S9, S10, Matrix.zeros(n_2, n_2));
            const C11 = C.subMatrix([0, 0], [n_2, n_2]);
            C11.content = P5.add(P4).sub(P2).add(P6);
            const C12 = C.subMatrix([0, n_2], [n_2, n_2]);
            C12.content = P1.add(P2);
            const C21 = C.subMatrix([n_2, 0], [n_2, n_2]);
            C21.content = P3.add(P4);
            const C22 = C.subMatrix([n_2, n_2], [n_2, n_2]);
            C22.content = P5.add(P1).sub(P3).sub(P7);


        }
        return C
    }

    QUnit.module('Matrix mult', function () {
        QUnit.test('simple sub write', function (assert) {
            const a = new Matrix([[1, 3], [7, 5]]);
            const c = a.subMatrix([1, 1]);
            c.set(0, 0, 12);
            assert.deepEqual(a.data, [[1, 3], [7, 12]]);
            assert.deepEqual(c.m, 1);
            assert.deepEqual(c.n, 1);
        });
        QUnit.test('simple', function (assert) {
            const a = new Matrix([[1, 3], [7, 5]]);
            const b = new Matrix([[6, 8], [4, 2]]);
            const c = matrixMult(a, b);
            assert.deepEqual(c.data, [[18, 14], [62, 66]]);
        });
        QUnit.test('offset', function (assert) {
            const a = new Matrix([[1, 3], [7, 5]]);
            const b = new Matrix(a.data, [1, 1])
            assert.deepEqual(b.get(0, 0), 5);
        });
        QUnit.test('recursive1', function (assert) {
            const a = new Matrix([[4]]);
            const b = new Matrix([[3]]);
            const c = Matrix.zeros(1, 1);
            matrixMultRecusive(a, b, c);
            assert.deepEqual(c.data, [[12]]);
        });
        QUnit.test('recursive', function (assert) {
            const a = new Matrix([[1, 3], [7, 5]]);
            const b = new Matrix([[6, 8], [4, 2]]);
            const c = Matrix.zeros(2, 2);
            matrixMultRecusive(a, b, c);
            assert.deepEqual(c.data, [[18, 14], [62, 66]]);
        });
        QUnit.test('recursive44', function (assert) {
            const a = Matrix.identity(4, 4);
            const c = Matrix.zeros(4, 4);
            matrixMultRecusive(a, a, c);
            assert.deepEqual(c.data, Matrix.identity(4, 4).data);
            const a2 = Matrix.random(4, 4);
            const b2 = Matrix.random(4, 4);
            const c2 = Matrix.zeros(4, 4);
            matrixMultRecusive(a2, b2, c2);
            const c3 = matrixMult(a2, b2);
            assert.deepEqual(c2.data, c3.data);
            console.log(c2.data, c3.data);

        });
        QUnit.test('strassen', function (assert) {
            const a = Matrix.identity(4, 4);
            const c = Matrix.zeros(4, 4);
            strassen(a, a, c);
            assert.deepEqual(c.data, Matrix.identity(4, 4).data);
            const a2 = Matrix.random(4, 4);
            const b2 = Matrix.random(4, 4);
            const c2 = Matrix.zeros(4, 4);
            strassen(a2, b2, c2);
            const c3 = matrixMult(a2, b2);
            assert.ok(c2.sub(c3).frNorm() < 1e-10);
            console.log(c2.data, c3.data);
        });

    });
</script>
</body>
